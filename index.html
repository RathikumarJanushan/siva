<!DOCTYPE html>
<html>

<head>
  <base href="/siva/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="siva">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>siva</title>
  <link rel="manifest" href="manifest.json">

  <!-- 🟢 Loading Animation-க்கான CSS -->
  <style>
    .loading-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      background-color: #ffffff;
      /* பின்னணி நிறம் */
      position: absolute;
      top: 0;
      left: 0;
      z-index: 9999;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #f3f3f3;
      border-top: 5px solid #2B3A8C;
      /* உங்களுடைய SIVA ஆப் நிறம் */
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <!-- 🟢 Loading Animation UI -->
  <div id="loading-indicator" class="loading-container">
    <div class="spinner"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <!-- 🟢 Flutter முழுமையாக லோட் ஆனவுடன் Loading-ஐ மறைக்க -->
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loadingElement = document.getElementById('loading-indicator');
      if (loadingElement) {
        loadingElement.remove(); // ஆப் திறந்ததும் ஸ்பின்னர் மறைந்துவிடும்
      }
    });
  </script>
</body>

</html>
